version: 2

sources:
  - name: silver
    description: "Couche silver (Parquet) produite par src/clean_silver.py et src/enrich_lmstudio.py."
    meta:
      # env_var() direct : passer par var('silver_dir') se résolvait mal
      # (la valeur brute, non rendue, de dbt_project.yml était réinjectée telle
      # quelle -> DuckDB recevait "{{ env_var(...) }}" littéral dans la requête).
      external_location: "read_parquet('{{ env_var('DBT_SILVER_DIR', '../data/silver') }}/{name}/**/*.parquet', union_by_name = true)"
    tables:
      - name: questions
        description: "Questions nettoyées + QCM déterministe (1 ligne / question)."
        columns:
          - name: question_id
            tests: [not_null, unique]
      - name: responses
        description: "Réponses brutes des modèles (1 ligne / question x modèle x prompt)."
        columns:
          - name: question_id
            tests: [not_null]
